<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="container">

        <h2>Registro de Estudiantes</h2>

        <form id="formulario">

            <input type="text" id="cedula" placeholder="Cédula" required>

            <input type="text" id="apellidos" placeholder="Apellidos" required>

            <input type="text" id="nombres" placeholder="Nombres" required>

            <input type="text" id="direccion" placeholder="Dirección" required>

            <input type="text" id="telefono" placeholder="Teléfono" required>

            <input type="email" id="correo" placeholder="Correo Electrónico" required>

            <input type="text" id="facultad" placeholder="Facultad" required>

            <input type="text" id="nivel" placeholder="Nivel" required>

            <input type="text" id="paralelo" placeholder="Paralelo" required>

            <button type="submit">Registrar Estudiante</button>

        </form>

        <h3>Estudiantes Registrados</h3>

        <table>
            <thead>
                <tr>
                    <th>Cédula</th>
                    <th>Apellidos</th>
                    <th>Nombres</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Facultad</th>
                    <th>Nivel</th>
                    <th>Paralelo</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
